{{/* Hugo Blox: Embodied Training 3D */}}
{{ $js := resources.Get "js/embodied-training-scene.js" | js.Build (dict "format" "iife" "target" "es2020" "minify" hugo.IsProduction) | fingerprint }}

<style>
  .embodied-training-visual {
    width: 100%;
    min-height: 240px;
    height: clamp(240px, 34vw, 340px);
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 22% 20%, rgba(34, 211, 238, 0.16), transparent 30%),
      radial-gradient(circle at 78% 64%, rgba(16, 185, 129, 0.14), transparent 28%),
      linear-gradient(135deg, #f8fafc 0%, #eef2f7 45%, #f8fafc 100%);
  }

  .dark .embodied-training-visual {
    background:
      radial-gradient(circle at 22% 20%, rgba(34, 211, 238, 0.14), transparent 30%),
      radial-gradient(circle at 78% 64%, rgba(16, 185, 129, 0.12), transparent 28%),
      linear-gradient(135deg, #09090b 0%, #111827 48%, #0f172a 100%);
  }

  .embodied-training-visual canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .embodied-training-visual__fallback {
    position: absolute;
    inset: 0;
    opacity: 0.72;
    background-image:
      linear-gradient(90deg, rgba(14, 165, 233, 0.15) 1px, transparent 1px),
      linear-gradient(rgba(16, 185, 129, 0.12) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(circle at center, black, transparent 72%);
  }

  .embodied-training-visual.is-ready .embodied-training-visual__fallback {
    display: none;
  }
</style>

<div
  class="embodied-training-visual"
  data-embodied-training-scene
  role="img"
  aria-label="具身智能训练系统的三维可视化，包含 embedding 点云、RL token 节点和训练轨迹。"
>
  <canvas data-embodied-training-canvas></canvas>
  <div class="embodied-training-visual__fallback" aria-hidden="true"></div>
</div>

<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
